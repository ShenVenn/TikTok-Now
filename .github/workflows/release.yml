name: Release TikTok-Now (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.1.0-custom)'
        required: true
        default: 'v2.1.0-custom'

permissions:
  contents: write

env:
  CARGO_HTTP_CHECK_REVOKE: "false"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build - Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build release binary
        working-directory: src-tauri
        run: cargo build --release

      - name: Package & checksum
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $src = "src-tauri\target\release\TikTok-Now.exe"
          $dst = "TikTok-Now_${tag}_windows-x86_64.exe"
          Copy-Item $src $dst
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          "$hash  $dst" | Out-File -Encoding ascii checksums-windows.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            TikTok-Now_${{ inputs.tag }}_windows-x86_64.exe
            checksums-windows.txt
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Prepare checksums.txt
        run: cp dist/checksums-windows.txt dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "TikTok-Now ${{ inputs.tag }} (custom build)"
          body: |
            Custom Windows build of TikTok-Now with a replaced icon.
            Run TikTok-Now_${{ inputs.tag }}_windows-x86_64.exe directly (no installer needed).
            SHA-256 hash is provided in checksums.txt.
          draft: false
          prerelease: false
          files: |
            dist/TikTok-Now_${{ inputs.tag }}_windows-x86_64.exe
            dist/checksums.txt
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
